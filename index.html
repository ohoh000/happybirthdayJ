<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Birthday Cake</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      #mainTitle {
        font-size: 32px;
        font-family: 'Pixelify Sans', sans-serif;
        margin-bottom: 8px;
      }

      #subTitle {
        font-size: 18px;
        font-family: 'Pixelify Sans', sans-serif;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="birthdayText"></div>
      <div class="cake-container">
        <div class="cake" id="cake"></div>
      </div>
    </div>

    <script>
      // Read URL params
      const params = new URLSearchParams(window.location.search);
      const name = params.get("name") || "Joel";
      let candleCount = parseInt(params.get("candles")) || 32;
      candleCount = Math.min(Math.max(candleCount, 1), 32);

      const birthdayText = document.getElementById("birthdayText");
      birthdayText.innerHTML = `
        <div id="mainTitle">Happy Birthday, ${name}!</div>
        <div id="subTitle">Make a wish and blow out the candles</div>
      `;

      const cake = document.getElementById("cake");

      const colors = [
        "green-candle",
        "purple-candle",
        "blue-candle",
        "yellow-candle",
      ];
      const CAKE_VISUAL_WIDTH = 35;

      function createCandles(count) {
        cake.innerHTML = "";
        const CANDLE_VISUAL_WIDTH = 2;
        const availableWidth = CAKE_VISUAL_WIDTH;
        const candlesPerRow = 6;
        const rowCount = Math.ceil(count / candlesPerRow);
        const shiftAmount = 4;

        for (let i = 0; i < count; i++) {
          const candle = document.createElement("div");
          candle.classList.add("candle");
          const colorClass = colors[Math.floor(Math.random() * colors.length)];
          candle.classList.add(colorClass);

          const row = Math.floor(i / candlesPerRow);
          const col = i % candlesPerRow;
          const totalCandlesInRow = Math.min(
            candlesPerRow,
            count - row * candlesPerRow
          );
          const rowSpacing = availableWidth / (totalCandlesInRow + 1);

          const leftBase = rowSpacing * (col + 1) - CANDLE_VISUAL_WIDTH / 2 + 5;
          const rowShift = row % 2 === 0 ? 0 : shiftAmount;

          candle.style.position = "absolute";
          candle.style.top = `${10 + row * 3}px`;
          candle.style.left = `${leftBase - rowShift + 4}px`;

          cake.appendChild(candle);
        }
      }

      createCandles(candleCount);

     // === Microphone / Blow Detection (Mobile Optimized + Extra Sensitive) ===
let audioContext;
let blown = false;

async function startMicDetection() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaStreamSource(stream);
    const analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;

    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    source.connect(analyser);

    function detectBlow() {
      analyser.getByteTimeDomainData(dataArray);

      // Calculate "volume" from waveform amplitude
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        const val = (dataArray[i] - 128) / 128; // center around 0
        sum += val * val;
      }
      const rms = Math.sqrt(sum / dataArray.length);

      // Super sensitive threshold (works on mobile)
      const BLOW_VOLUME_THRESHOLD = 0.05;

      if (rms > BLOW_VOLUME_THRESHOLD && !blown) {
        blown = true;
        blowOutCandles();
      }

      requestAnimationFrame(detectBlow);
    }

    detectBlow();
  } catch (err) {
    console.error("Mic access error:", err);
  }
}

// === Resume mic after user tap (needed for iOS / Chrome mobile) ===
async function enableMic() {
  try {
    if (!audioContext) {
      await startMicDetection();
    } else if (audioContext.state === "suspended") {
      await audioContext.resume();
    }
  } catch (err) {
    console.error("Mic resume error:", err);
  }
  document.removeEventListener("click", enableMic);
}

document.addEventListener("click", enableMic);

function blowOutCandles() {
  const candles = document.querySelectorAll(".candle");
  candles.forEach((candle) => {
    const delay = Math.random() * 800;
    setTimeout(() => {
      candle.classList.add("blown");
    }, delay);
  });

  setTimeout(() => {
    const subTitle = document.getElementById("subTitle");
    if (subTitle) {
      subTitle.textContent =
        "Yay! Hope to spend the next one together :D wo xiang ni >_< 🎉";
    }
  }, 1000);
}

// ✅ Mobile-friendly mic setup
async function enableMic() {
  try {
    // Resume AudioContext if it's suspended
    if (window.audioContext && window.audioContext.state === "suspended") {
      await window.audioContext.resume();
    } else {
      await startMicDetection();
    }
  } catch (err) {
    console.error("Error enabling mic:", err);
  }
  document.removeEventListener("click", enableMic);
}

// Wait for user tap (mobile browsers need a gesture)
document.addEventListener("click", enableMic);
    </script>
  </body>
</html>
